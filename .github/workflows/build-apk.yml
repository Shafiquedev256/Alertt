
name: Build Forex Alert APK

on:
  workflow_dispatch:

  push:
    paths:
      - "forex_alert_fixed.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract Flutter project
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f forex_alert_fixed.zip ]; then
            echo "::error::forex_alert_fixed.zip was not found."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -o forex_alert_fixed.zip -d extracted

      # 3. Locate Flutter project
      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find extracted -name pubspec.yaml -type f -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "::error::No Flutter pubspec.yaml found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Flutter project found at: $PROJECT_DIR"

      # 4. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 6. Display environment information
      - name: Check build environment
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      # 7. Generate Android project
      - name: Generate Android project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter create \
            --platforms=android \
            --org com.example \
            --project-name forex_alert \
            .

      # 8. Configure Android project
      - name: Configure Android project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          if [ ! -f scripts/prepare_android.py ]; then
            echo "::error::scripts/prepare_android.py was not found."
            exit 1
          fi

          python3 scripts/prepare_android.py

      # 9. Install dependencies
      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter pub get

      # 10. Validate Flutter project
      - name: Analyze Flutter project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter analyze

      # 11. Build release APK
      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build apk \
            --release \
            --verbose

      # 12. Verify APK
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      # 13. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forex-alert-release-apk
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
