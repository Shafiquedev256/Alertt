
name: Build Forex Alert APK

on:
  workflow_dispatch:

  push:
    paths:
      - "forex_alert_fixed.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Forex Alerts Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -e

          if [ ! -f forex_alert_fixed.zip ]; then
            echo "::error::forex_alert_fixed.zip is missing."
            exit 1
          fi

          unzip -t forex_alert_fixed.zip

      - name: Extract Flutter project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q forex_alert_fixed.zip -d extracted

      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find extracted \
            -type f \
            -name pubspec.yaml \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "::error::Flutter pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project directory: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check environment
        run: |
          flutter --version
          dart --version
          java -version

      - name: Generate Android project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          flutter create \
            --platforms=android \
            --org com.example \
            --project-name forex_alert \
            .

      - name: Configure Android project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          if [ ! -f scripts/prepare_android.py ]; then
            echo "::error::prepare_android.py is missing."
            exit 1
          fi

          python3 scripts/prepare_android.py

      - name: Install Flutter dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter pub get

      - name: Verify Android configuration
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          test -f android/app/build.gradle.kts \
            || test -f android/app/build.gradle

          test -f android/app/src/main/AndroidManifest.xml

          grep -n "FOREGROUND_SERVICE" \
            android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build apk \
            --release \
            --verbose

      - name: Verify generated APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK generation failed."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: forex-alert-release-apk
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
